<nav id="site-navigation" class="main-navigation"  aria-label="Основна навигация">

    <ul class="nav-list">

        {% for item in site.data.navigation %}

            <li>
                <a href="{{ item.url | relative_url }}" 
                    {% if page.url == item.url %}
                        aria-current="page"
                        class="active"
                    {% endif %}>
                    {{ item.title }}
                </a>
            </li>

        {% endfor %}

    </ul>
</nav>
